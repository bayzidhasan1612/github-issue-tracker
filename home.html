<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title and favicon -->
    <title>Github Issue Tracker</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- tailwind+daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fonts related -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header>
      <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
          <div class="flex items-center gap-2 w-11/12">
            <div class="h-[36px] w-[37px]">
              <img src="./assets/github-logo.png" class="" alt="" />
            </div>
            <a class="text-xl font-bold">GitHub Issue Tracker</a>
          </div>
        </div>
        <div class="flex gap-2">
          <label class="input">
            <i class="fa-brands fa-sistrix text-gray-500"></i>

            <input type="search" required placeholder="Search Issues" />
          </label>
          <button class="btn btn-primary">Search</button>
        </div>
      </div>
    </header>

    <!-- button section -->
    <section class="container w-11/12 mx-auto border border-white p-6 mt-16 bg-base-100 shadow-sm rounded-md">
      <div class="flex gap-3">
        <button class="btn btn-soft btn-primary px-10 py-2">All</button>
        <button class="btn btn-soft btn-primary px-10 py-2">Open</button>
        <button class="btn btn-soft btn-primary px-10 py-2">Closed</button>
      </div>
    </section>

    <section class="container w-11/12 mx-auto border border-white p-6 mt-4 bg-base-100 shadow-sm rounded-md">
<div class="flex justify-between items-center">
  <div class="flex items-center gap-2">
    <div class="rounded-full bg-[#ECE4FF] p-1">
      <img src="./assets/Aperture.png" alt="">
    </div>
    <div>
      <h2 class="font-semibold">50 Issues</h2>
      <p class="text-gray-500 font-light">Track and manage your project issues</p>

    </div>
  </div>

  <div class="flex gap-4">
    <p>Open</p>
    <p>Closed</p>
  </div>

</div>

    </section>

  </body>
</html>
