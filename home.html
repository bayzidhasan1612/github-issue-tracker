<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title and favicon -->
    <title>Github Issue Tracker</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- tailwind+daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fonts related -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header>
      <div class="navbar bg-base-100 shadow-sm px-4 md:px-6">
        <div class="flex-1">
          <div class="flex items-center gap-2 w-11/12">
            <div class="h-[36px] w-[37px]">
              <img class="w-full h-full" src="./assets/github-logo.png" class="" alt="" />
            </div>
            <a class="md:text-xl font-bold">GitHub Issue Tracker</a>
          </div>
        </div>
        <div class="flex flex-col md:flex-row gap-2">
          <label class="input">
            <i class="fa-brands fa-sistrix text-gray-500"></i>

            <input
              id="search-input"
              type="search"
              required
              placeholder="Search Issues"
            />
          </label>
          <button id="search-btn" class="btn btn-primary">Search</button>
        </div>
      </div>
    </header>

    <!-- button section -->
    <section
      id="btn-container"
      class="container w-11/12 mx-auto border border-white p-6 mt-16 bg-base-100 shadow-sm rounded-md"
    >
      <div class="flex flex-wrap gap-2 md:gap-3 lg:gap-4">
        <button
          onclick="allBtnClicked()"
          id="all-btn"
          class="btn btn-soft btn-primary px-10 py-2"
        >
          All
        </button>
        <button
          onclick="openBtnClicked()"
          id="open-btn"
          class="btn btn-soft btn-primary px-10 py-2"
        >
          Open
        </button>
        <button
          onclick="closedBtnClick()"
          id="closed-btn"
          class="btn btn-soft btn-primary px-10 py-2"
        >
          Closed
        </button>
      </div>
    </section>

    <!-- Loading Spinner -->
    <section id="spinner" class="flex justify-center items-center py-20 hidden">
      <span class="loading loading-spinner loading-xl"></span>
    </section>

    <!-- Issue Information section -->
    <section
      id="issue-info"
      class="container w-11/12 mx-auto border border-white p-6 mt-4 bg-base-100 shadow-sm rounded-md"
    >
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <div class="rounded-full bg-[#ECE4FF] p-1">
            <img src="./assets/Aperture.png" alt="" />
          </div>
          <div>
            <h2 id="issue-number" class="font-semibold">0 Issues</h2>
            <p class="text-gray-500 font-light">
              Track and manage your project issues
            </p>
          </div>
        </div>

        <div class="flex gap-4">
          <div class="flex items-center gap-2">
            <div
              class="flex items-center w-3 h-3 rounded-full bg-green-600"
            ></div>
            <p>Open</p>
          </div>

          <div class="flex items-center gap-2">
            <div
              class="flex items-center w-3 h-3 rounded-full bg-purple-700"
            ></div>
            <p>Closed</p>
          </div>
        </div>
      </div>
    </section>

    <!-- All issues -->
    <section
      id="all-issues"
      class="container w-11/12 mx-auto border border-white p-6 mt-1 bg-base-100 shadow-sm rounded-sm"
    >
      <div
        id="all-issue-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 space-y-4 bg-white"
      >
        <!-- issue card -->
      </div>
    </section>

    <!-- open issues -->
    <section
      class="container w-11/12 mx-auto border border-white p-6 mt-1 bg-base-100 shadow-sm rounded-sm hidden"
    ></section>

    <!-- modal -->
    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn hidden" onclick="my_modal_5.showModal()"> -->
    <!-- open modal -->
    <!-- </button> -->
    <dialog id="issue_modal" class="modal modal-bottom sm:modal-middle">
      <div class="modal-box max-w-3xl">
        <div id="details-container"></div>

        <div class="modal-action">
          <form method="dialog">
            <!-- if there is a button in form, it will close the modal -->
            <button class="btn btn-outline btn-primary">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <script src="./script/issues.js"></script>
  </body>
</html>
